[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "message-io"
version = "1.0.0"
description = "Platform-neutral REST bridge for sending and receiving messages."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "lark-oapi>=1.6.9",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]
test = [
    "fastapi>=0.111",
    "lark-oapi>=1.6.9",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
message-io = "message_io.server_cli:main"
message-io-server = "message_io.server_cli:main"
message-io-listener = "message_io.server_cli:listener_main"
message-ioctl = "message_io.cli:main"

[tool.setuptools.packages.find]
include = ["message_io*"]
