[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-io"
version = "0.1.0"
description = "Minimal REST bridge for Feishu group markdown sending and unread message polling."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "lark-oapi>=1.6.9",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
feishu-io = "feishu_io.server:main"
feishu-io-listener = "feishu_io.listener:main"
feishu-ioctl = "feishu_io.cli:main"

[tool.setuptools.packages.find]
include = ["feishu_io*"]
